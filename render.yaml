# Render Blueprint: New > Blueprint on render.com, pick this repo, fill in the blank values.
services:
  - type: web
    name: employmentnewshub
    runtime: docker
    plan: starter          # persistent disks need a paid plan; the free plan would lose your posts
    region: singapore      # closest Render region to India
    healthCheckPath: /api/health
    disk:
      name: site-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SITE_NAME
        value: EmploymentNewsHub
      - key: SITE_URL
        sync: false        # e.g. https://employmentnewshub.onrender.com, later your own domain
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false
      - key: SEED_SAMPLE
        value: "true"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DIGEST_HOUR
        value: "8"
      - key: SOURCE_CHECKS
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
